# Base16 -> yazi theme mapping, taken from tinted-theming/base16-yazi's
# templates/default.mustache (the same template Stylix's own yazi target
# renders through). The @baseNN@ placeholders are substituted by flake.nix
# from whatever base16 palette is passed to mkYazi; @syntectTheme@ is
# substituted with the path to a .tmTheme file for text-preview syntax
# highlighting (mgr.syntect_theme).

[completion.active]
bg = "@base03@"
fg = "@base0E@"

[completion.border]
fg = "@base0D@"

[completion.inactive]
fg = "@base05@"

[[filetype.rules]]
fg = "@base0C@"
mime = "image/*"

[[filetype.rules]]
fg = "@base0A@"
mime = "video/*"

[[filetype.rules]]
fg = "@base0A@"
mime = "audio/*"

[[filetype.rules]]
fg = "@base0E@"
mime = "application/zip"

[[filetype.rules]]
fg = "@base0E@"
mime = "application/gzip"

[[filetype.rules]]
fg = "@base0E@"
mime = "application/tar"

[[filetype.rules]]
fg = "@base0E@"
mime = "application/bzip"

[[filetype.rules]]
fg = "@base0E@"
mime = "application/bzip2"

[[filetype.rules]]
fg = "@base0E@"
mime = "application/7z-compressed"

[[filetype.rules]]
fg = "@base0E@"
mime = "application/rar"

[[filetype.rules]]
fg = "@base0E@"
mime = "application/xz"

[[filetype.rules]]
fg = "@base0B@"
mime = "application/doc"

[[filetype.rules]]
fg = "@base0B@"
mime = "application/pdf"

[[filetype.rules]]
fg = "@base0B@"
mime = "application/rtf"

[[filetype.rules]]
fg = "@base0B@"
mime = "application/vnd.*"

[[filetype.rules]]
bold = true
fg = "@base0D@"
url = "*/"

[[filetype.rules]]
fg = "@base05@"
mime = "*"

