# cargo-deny config for pkgs/kb.
[advisories]
version = 2
ignore = []

[licenses]
version = 2
# kb is private (publish = false), so it needs no license of its own.
private = { ignore = true }
allow = ["MIT", "Apache-2.0", "Unicode-3.0"]

[bans]
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
